[package]
name = "timestamp-converter"
version = "1.0.0"
description = "Timestamp converter desktop app (Tauri) reusing the uTools plugin frontend"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true