<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
          --bg: #0f1117;
          --panel: #1a1d27;
          --card: #21253a;
          --border: #2e3348;
          --text: #e8ecf4;
          --dim: #7c82a0;
          --accent: #5b9aff;
          --accent2: #00d4aa;
          --accent-soft: rgba(91,154,255,0.13);
          --accent2-soft: rgba(0,212,170,0.13);
          --green: #00d4aa;
          --danger: #ff6b7a;
          --warn: #ffb86b;
          --mono: "Cascadia Code","SF Mono",Consolas,"JetBrains Mono","Courier New",monospace;
        }
        body{background:var(--bg);color:var(--text);font:13px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color-scheme:dark;user-select:none;-webkit-font-smoothing:antialiased}
        
        .test-container {
            padding: 20px;
            margin: 20px;
        }
        
        .bg-sample {
            width: 100px;
            height: 50px;
            margin: 10px 0;
            border: 1px solid white;
        }
        
        .input-test {
            margin: 20px 0;
        }
        
        .input-test input {
            flex: 0 1 200px;
            background: var(--panel);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 15px;
            font-family: var(--mono);
            outline: none;
            transition: border-color .15s;
            max-width: 300px;
        }
        
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 20px 0;
        }
        
        .input-row input {
            flex: 1;
            background: var(--bg);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 15px;
            font-family: var(--mono);
            outline: none;
            transition: border-color .15s;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h3>颜色测试</h3>
        <div>背景色 var(--bg): <span style="color: #0f1117;">#0f1117</span></div>
        <div class="bg-sample" style="background: var(--bg);"></div>
        
        <div>面板色 var(--panel): <span style="color: #1a1d27;">#1a1d27</span></div>
        <div class="bg-sample" style="background: var(--panel);"></div>
        
        <div>边框色 var(--border): <span style="color: #2e3348;">#2e3348</span></div>
        <div class="bg-sample" style="background: var(--border);"></div>
        
        <h3>输入框测试</h3>
        <div class="input-test">
            <input type="text" value="时间戳输入框（应该有panel背景）">
        </div>
        
        <div class="input-row">
            <input type="text" value="普通输入框（应该有bg背景）">
        </div>
    </div>
</body>
</html>
